<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- CrossLinked Glow Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Radar / OSINT Scanner Target Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.35"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.25"/>

  <!-- Crosshair Guides -->
  <line x1="32" y1="8" x2="32" y2="15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="49" x2="32" y2="56" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="8" y1="32" x2="15" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="49" y1="32" x2="56" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Interconnected Cross-Link Network Nodes (Forming an 'X' & Network Chain) -->
  <!-- Top-Left to Bottom-Right Link -->
  <line x1="20" y1="20" x2="44" y2="44" stroke="url(#blueGlow)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Bottom-Left to Top-Right Link -->
  <line x1="20" y1="44" x2="44" y2="20" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Connection Nodes -->
  <!-- Center Core Hub -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2" fill="#0284c7"/>

  <!-- Corner Identity Nodes -->
  <circle cx="20" cy="20" r="4" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="44" cy="20" r="4" fill="#06b6d4" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="20" cy="44" r="4" fill="#3b82f6" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="4" fill="#60a5fa" stroke="#0f172a" stroke-width="1.5"/>
</svg>

